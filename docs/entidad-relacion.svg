<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 16px Arial, sans-serif; fill: #374151; }
      .table { fill: #ffffff; stroke: #2563eb; stroke-width: 2.5; rx: 14; ry: 14; }
      .header { fill: #dbeafe; }
      .field { font: 16px Arial, sans-serif; fill: #111827; }
      .th { font: 700 20px Arial, sans-serif; fill: #1e3a8a; }
      .line { stroke: #e5e7eb; stroke-width: 1.5; }
      .rel { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .note { font: 15px Arial, sans-serif; fill: #374151; }
      .badge { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 10; ry: 10; }
      .badgeText { font: 14px Arial, sans-serif; fill: #065f46; font-weight: 700; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <text x="700" y="45" class="title" text-anchor="middle">Diagrama entidad-relación de la base de datos</text>
  <text x="700" y="75" class="subtitle" text-anchor="middle">Modelo SQLite pensado para temas trending, posts generados y logs de publicación</text>

  <g transform="translate(90,160)">
    <rect width="360" height="360" class="table"/>
    <rect width="360" height="60" class="table header"/>
    <text x="180" y="38" text-anchor="middle" class="th">trending_topics</text>
    <line x1="0" y1="60" x2="360" y2="60" class="line"/>
    <text x="24" y="96" class="field">id (PK) : INTEGER</text>
    <line x1="0" y1="112" x2="360" y2="112" class="line"/>
    <text x="24" y="146" class="field">title : TEXT</text>
    <line x1="0" y1="162" x2="360" y2="162" class="line"/>
    <text x="24" y="196" class="field">normalized_title : TEXT</text>
    <line x1="0" y1="212" x2="360" y2="212" class="line"/>
    <text x="24" y="246" class="field">source : TEXT</text>
    <line x1="0" y1="262" x2="360" y2="262" class="line"/>
    <text x="24" y="296" class="field">score : REAL</text>
    <line x1="0" y1="312" x2="360" y2="312" class="line"/>
    <text x="24" y="346" class="field">used : INTEGER</text>
    <line x1="0" y1="362" x2="360" y2="362" class="line"/>
    <text x="24" y="396" class="field">created_at : DATETIME</text>
  </g>

  <g transform="translate(520,160)">
    <rect width="360" height="410" class="table"/>
    <rect width="360" height="60" class="table header"/>
    <text x="180" y="38" text-anchor="middle" class="th">generated_posts</text>
    <line x1="0" y1="60" x2="360" y2="60" class="line"/>
    <text x="24" y="96" class="field">id (PK) : INTEGER</text>
    <line x1="0" y1="112" x2="360" y2="112" class="line"/>
    <text x="24" y="146" class="field">topic_id (FK) : INTEGER</text>
    <line x1="0" y1="162" x2="360" y2="162" class="line"/>
    <text x="24" y="196" class="field">image_url : TEXT</text>
    <line x1="0" y1="212" x2="360" y2="212" class="line"/>
    <text x="24" y="246" class="field">caption : TEXT</text>
    <line x1="0" y1="262" x2="360" y2="262" class="line"/>
    <text x="24" y="296" class="field">description : TEXT</text>
    <line x1="0" y1="312" x2="360" y2="312" class="line"/>
    <text x="24" y="346" class="field">hashtags : TEXT</text>
    <line x1="0" y1="362" x2="360" y2="362" class="line"/>
    <text x="24" y="396" class="field">status : TEXT</text>
    <line x1="0" y1="412" x2="360" y2="412" class="line"/>
    <text x="24" y="446" class="field">created_at : DATETIME</text>
  </g>

  <g transform="translate(950,160)">
    <rect width="360" height="410" class="table"/>
    <rect width="360" height="60" class="table header"/>
    <text x="180" y="38" text-anchor="middle" class="th">publication_logs</text>
    <line x1="0" y1="60" x2="360" y2="60" class="line"/>
    <text x="24" y="96" class="field">id (PK) : INTEGER</text>
    <line x1="0" y1="112" x2="360" y2="112" class="line"/>
    <text x="24" y="146" class="field">post_id (FK) : INTEGER</text>
    <line x1="0" y1="162" x2="360" y2="162" class="line"/>
    <text x="24" y="196" class="field">platform : TEXT</text>
    <line x1="0" y1="212" x2="360" y2="212" class="line"/>
    <text x="24" y="246" class="field">status : TEXT</text>
    <line x1="0" y1="262" x2="360" y2="262" class="line"/>
    <text x="24" y="296" class="field">response_json : TEXT</text>
    <line x1="0" y1="312" x2="360" y2="312" class="line"/>
    <text x="24" y="346" class="field">error_message : TEXT</text>
    <line x1="0" y1="362" x2="360" y2="362" class="line"/>
    <text x="24" y="396" class="field">created_at : DATETIME</text>
  </g>

  <path d="M450 340 L520 340" class="rel"/>
  <rect x="450" y="300" width="160" height="32" class="badge"/>
  <text x="530" y="321" text-anchor="middle" class="badgeText">1 tema → muchos posts</text>

  <path d="M880 360 L950 360" class="rel"/>
  <rect x="865" y="400" width="185" height="32" class="badge"/>
  <text x="958" y="421" text-anchor="middle" class="badgeText">1 post → muchos logs</text>

  <text x="90" y="650" class="th">Lectura del modelo</text>
  <text x="90" y="690" class="note">• Un registro en trending_topics representa un tema detectado por el sistema.</text>
  <text x="90" y="725" class="note">• Un registro en generated_posts representa el contenido generado a partir de un tema.</text>
  <text x="90" y="760" class="note">• Un registro en publication_logs representa cada intento o resultado técnico de publicación.</text>
  <text x="90" y="815" class="note">Relaciones:</text>
  <text x="120" y="850" class="note">1. trending_topics.id se relaciona con generated_posts.topic_id</text>
  <text x="120" y="885" class="note">2. generated_posts.id se relaciona con publication_logs.post_id</text>
</svg>
